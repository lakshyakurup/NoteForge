<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="NoteForge architecture">
  <rect width="900" height="280" fill="#0f172a" rx="12"/>
  <!-- boxes -->
  <rect x="40" y="90" width="160" height="80" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">Browser UI</text>
  <text x="120" y="148" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Next.js 15</text>

  <rect x="280" y="90" width="160" height="80" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="360" y="125" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">API Route</text>
  <text x="360" y="148" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Zod + AI lib</text>

  <rect x="520" y="50" width="140" height="60" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="590" y="85" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">Gemini</text>

  <rect x="520" y="140" width="140" height="60" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="590" y="175" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">OpenAI</text>

  <rect x="720" y="90" width="140" height="80" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="790" y="125" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="14" font-weight="600">localStorage</text>
  <text x="790" y="148" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">History + Auth</text>

  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="200" y1="130" x2="275" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="120" x2="515" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="140" x2="515" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="150" x2="720" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>
